[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Keep the free-tier Supabase project from auto-pausing: run a tiny query every
# 3 days (well inside Supabase's ~7-day inactivity window) at 06:00 UTC.
[functions."keep-alive"]
  schedule = "0 6 */3 * *"

[[redirects]]
  from = "/api/ledger"
  to = "/.netlify/functions/list-ledger"
  status = 200

[[redirects]]
  from = "/api/ledger/evidence"
  to = "/.netlify/functions/submit-evidence"
  status = 200

[[redirects]]
  from = "/api/ledger/:id/settle"
  to = "/.netlify/functions/simulate-settlement"
  status = 200

[[redirects]]
  from = "/api/ledger/:id/export.dsr"
  to = "/.netlify/functions/export-dsr"
  status = 200

[[redirects]]
  from = "/api/catalog/ingest"
  to = "/.netlify/functions/catalog-ingest"
  status = 200

[[redirects]]
  from = "/api/catalog/match"
  to = "/.netlify/functions/catalog-match"
  status = 200

# Sautify Awards live in their own Netlify project (sautify-awards) so an awards
# deploy can never break these pages. Serve them at sautify.co.ke/awards.
# Must stay ABOVE the "/*" catch-all below.
[[redirects]]
  from = "/awards"
  to = "https://sautify-awards.netlify.app/awards/"
  status = 200
  force = true

[[redirects]]
  from = "/awards/*"
  to = "https://sautify-awards.netlify.app/awards/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
